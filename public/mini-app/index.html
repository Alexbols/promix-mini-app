<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promix Task</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      background: #0f172a; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
    }
    .gradient-bg { background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7); }
    .card { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); border: 1px solid #334155; }
    .reaction-btn { 
      transition: all 0.2s ease; 
      cursor: pointer;
      user-select: none;
    }
    .reaction-btn:active { transform: scale(0.92); }
    .reaction-btn.selected { 
      background: linear-gradient(135deg, #6366f1, #8b5cf6); 
      transform: scale(1.12); 
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
      border-color: #818cf8;
    }
    .progress-bar {
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .checkmark {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.8s ease forwards;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    .confetti {
      position: fixed;
      top: -10px;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      transition: all 0.2s;
    }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
    iframe { background: #1e293b; }
  </style>
</head>
<body>

  <div id="loading" class="text-center">
    <div class="w-14 h-14 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-slate-400 text-sm">Загрузка задания...</p>
  </div>

  <div id="content" class="hidden w-full max-w-md space-y-4">
    <!-- Шапка -->
    <div class="gradient-bg p-5 rounded-2xl text-center shadow-lg">
      <h1 class="text-xl font-bold" id="task-title">Задание</h1>
      <p class="text-sm opacity-90 mt-1" id="task-reward">💰 15 PMC</p>
    </div>

    <!-- Прогресс просмотра -->
    <div id="view-progress" class="hidden card p-4 rounded-xl">
      <div class="flex justify-between text-sm text-slate-300 mb-1">
        <span>⏳ Осталось:</span>
        <span><b id="timer">15</b> сек</span>
      </div>
      <div class="progress-bar">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
    </div>

    <!-- Контент для просмотра -->
    <div id="view-content" class="hidden card p-3 rounded-xl">
      <iframe id="embed-frame" class="w-full h-52 rounded-lg border border-slate-700" frameborder="0"></iframe>
      <p class="text-xs text-slate-500 mt-2 text-center">⚠️ Не закрывайте окно до завершения</p>
    </div>

    <!-- Реакции -->
    <div id="react-btn" class="hidden card p-4 rounded-xl">
      <p class="text-center text-sm text-slate-300 mb-3">Выберите реакцию:</p>
      <div class="grid grid-cols-4 gap-2">
        <button data-reaction="👍" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">👍</button>
        <button data-reaction="❤️" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">❤️</button>
        <button data-reaction="🔥" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">🔥</button>
        <button data-reaction="🎉" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">🎉</button>
        <button data-reaction="😮" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">😮</button>
        <button data-reaction="😢" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">😢</button>
        <button data-reaction="😡" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">😡</button>
        <button data-reaction="🤔" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-3 rounded-xl text-2xl border border-transparent">🤔</button>
      </div>
      <p class="text-xs text-slate-500 mt-3 text-center">Нажмите на любую реакцию</p>
    </div>

    <!-- Кнопка выполнения -->
    <button id="complete-btn" class="btn-primary w-full text-white font-bold py-3.5 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed transition" disabled>
      ✨ Выполнить задание
    </button>

    <!-- Статус -->
    <div id="status" class="text-center text-sm text-slate-400"></div>

    <!-- Анимация успеха -->
    <div id="success-animation" class="hidden text-center">
      <svg class="w-20 h-20 mx-auto text-emerald-400" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="6" fill="none"/>
        <polyline class="checkmark" points="30,50 45,65 70,35" stroke="currentColor" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="text-xl font-bold text-emerald-400 mt-2">Выполнено!</p>
      <p class="text-sm text-slate-400">Задание засчитано, награда получена</p>
    </div>
  </div>

  <div id="error" class="hidden text-center text-red-400">
    <p>❌ Ошибка загрузки задания</p>
    <button onclick="Telegram.WebApp.close()" class="mt-4 text-indigo-400 underline">Закрыть</button>
  </div>

  <script>
    (function() {
      console.log('🚀 Mini App загружается...');

      const tg = Telegram.WebApp;
      tg.ready();
      tg.expand();

      console.log('✅ Telegram WebApp инициализирован');
      console.log('👤 user:', tg.initDataUnsafe.user);

      const urlParams = new URLSearchParams(window.location.search);
      console.log('🔗 URL params:', Object.fromEntries(urlParams));

      const task = {
        id: urlParams.get('task_id'),
        type: urlParams.get('type'),
        title: urlParams.get('title'),
        reward: urlParams.get('reward'),
        link: urlParams.get('link'),
        chatId: urlParams.get('chat_id'),
        messageId: urlParams.get('message_id')
      };

      const els = {
        loading: document.getElementById('loading'),
        content: document.getElementById('content'),
        error: document.getElementById('error'),
        title: document.getElementById('task-title'),
        reward: document.getElementById('task-reward'),
        viewProgress: document.getElementById('view-progress'),
        timer: document.getElementById('timer'),
        progressBar: document.getElementById('progress-bar'),
        viewContent: document.getElementById('view-content'),
        embedFrame: document.getElementById('embed-frame'),
        reactBtn: document.getElementById('react-btn'),
        completeBtn: document.getElementById('complete-btn'),
        status: document.getElementById('status'),
        successAnim: document.getElementById('success-animation')
      };

      const VIEW_MIN_TIME = 15; // seconds
      let timeSpent = 0;
      let reaction = null;
      let timerInterval = null;
      let isCompleted = false;

      function init() {
        if (!task.id || !task.type) {
          showError('Неверные данные задания');
          return;
        }

        els.title.textContent = task.title || 'Задание';
        els.reward.textContent = `💰 ${task.reward} PMC`;

        if (task.type === 'view') setupViewTask();
        else if (task.type === 'react') setupReactTask();
        else {
          showError('Неподдерживаемый тип задания');
          return;
        }

        els.loading.classList.add('hidden');
        els.content.classList.remove('hidden');
      }

      function setupViewTask() {
        els.viewProgress.classList.remove('hidden');
        els.viewContent.classList.remove('hidden');

        if (task.link) {
          if (task.link.includes('t.me/')) {
            const parts = task.link.split('/');
            const channel = parts[3];
            const postId = parts[4];
            if (channel && postId) {
              els.embedFrame.src = `https://t.me/${channel}/${postId}?embed=1&mode=dark`;
            }
          } else {
            els.embedFrame.src = task.link;
          }
        }

        let remaining = VIEW_MIN_TIME;
        timerInterval = setInterval(() => {
          timeSpent++;
          remaining = Math.max(0, VIEW_MIN_TIME - timeSpent);
          els.timer.textContent = remaining;
          const pct = Math.min(100, (timeSpent / VIEW_MIN_TIME) * 100);
          els.progressBar.style.width = pct + '%';

          if (remaining <= 0) {
            clearInterval(timerInterval);
            els.status.textContent = '✅ Время просмотра истекло!';
            enableComplete();
          }
        }, 1000);
      }

      function setupReactTask() {
        els.reactBtn.classList.remove('hidden');
        document.querySelectorAll('.reaction-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const emoji = this.getAttribute('data-reaction');
            document.querySelectorAll('.reaction-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            reaction = emoji;
            els.status.textContent = `Выбрана реакция: ${reaction}`;
            enableComplete();
          });
        });
      }

      function enableComplete() {
        if (isCompleted) return;
        if (task.type === 'view' && timeSpent >= VIEW_MIN_TIME) {
          els.completeBtn.disabled = false;
        }
        if (task.type === 'react' && reaction) {
          els.completeBtn.disabled = false;
        }
      }

      function generateConfetti() {
        const colors = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590'];
        for (let i = 0; i < 50; i++) {
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.left = Math.random() * 100 + '%';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.width = (Math.random() * 8 + 4) + 'px';
          el.style.height = (Math.random() * 8 + 4) + 'px';
          el.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          el.style.animationDelay = (Math.random() * 0.6) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2500);
        }
      }

      els.completeBtn.addEventListener('click', function() {
        if (isCompleted) return;
        isCompleted = true;
        this.disabled = true;
        els.status.textContent = '🔄 Отправка данных...';

        const verification = {
          task_id: task.id,
          user_id: tg.initDataUnsafe.user?.id,
          type: task.type,
          time_spent: timeSpent,
          reaction: reaction,
          chat_id: task.chatId,
          message_id: task.messageId,
          timestamp: Date.now()
        };

        console.log('📤 Отправка данных боту:', verification);

        try {
          tg.sendData(JSON.stringify(verification));
          els.status.textContent = '✅ Данные отправлены!';
          this.classList.add('hidden');
          els.successAnim.classList.remove('hidden');
          generateConfetti();

          setTimeout(() => {
            tg.close();
          }, 2000);
        } catch (err) {
          console.error('❌ Ошибка sendData:', err);
          els.status.textContent = '❌ Ошибка отправки: ' + err.message;
          isCompleted = false;
          this.disabled = false;
        }
      });

      function showError(msg) {
        els.loading.classList.add('hidden');
        els.error.classList.remove('hidden');
        els.error.querySelector('p').textContent = `❌ ${msg}`;
      }

      // Запуск
      if (window.location.search) {
        init();
      } else {
        showError('Откройте через Telegram-бота');
      }
    })();
  </script>
</body>
</html>
