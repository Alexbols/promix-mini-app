<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promix Task</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }
    .gradient h1 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }
    .gradient p { opacity: 0.95; font-size: 18px; font-weight: 600; }
    
    .timer-display {
      font-size: 56px;
      font-weight: 800;
      text-align: center;
      margin: 24px 0;
      color: #667eea;
      text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
    }
    
    .progress-container {
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 1s linear;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
    }
    
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    
    .btn-secondary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary:hover { transform: translateY(-2px); }
    
    .status {
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 600;
    }
    .status.info { background: rgba(102, 126, 234, 0.15); color: #a5b4fc; }
    .status.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .status.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    
    .info-block {
      background: rgba(102, 126, 234, 0.1);
      border-left: 4px solid #667eea;
      padding: 16px 20px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    
    .step {
      display: flex;
      align-items: flex-start;
      margin: 12px 0;
    }
    .step-num {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .step-text { padding-top: 4px; }
    
    .checkmark {
      display: inline-block;
      width: 24px;
      height: 24px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      position: relative;
    }
    .checkmark::after {
      content: '✓';
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .hidden { display: none !important; }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(102, 126, 234, 0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div id="loading" style="text-align: center; padding: 60px 20px;">
    <div class="spinner"></div>
    <p style="font-size: 16px; opacity: 0.8;">Загрузка задания...</p>
  </div>

  <div id="content" class="hidden">
    <div class="gradient">
      <h1 id="task-title">Задание</h1>
      <p id="task-reward">💰 15 PMC</p>
    </div>

    <!-- VIEW: Просмотр поста -->
    <div id="view-section" class="hidden">
      <div class="card">
        <h3 style="margin-bottom: 16px; font-size: 18px;">👁 Просмотрите пост</h3>
        
        <div class="info-block">
          <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">Нажмите кнопку ниже</div>
          </div>
          <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">Просмотрите пост <b>15 секунд</b></div>
          </div>
          <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">Вернитесь и нажмите "Проверить"</div>
          </div>
        </div>
        
        <button id="open-link-btn" class="btn btn-secondary">
          🔗 Открыть пост в Telegram
        </button>
        
        <div class="timer-display" id="timer-big">15</div>
        
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- REACT: Реакция на пост -->
    <div id="react-section" class="hidden">
      <div class="card">
        <h3 style="margin-bottom: 16px; font-size: 18px;">❤️ Поставьте реакцию</h3>
        
        <div class="info-block">
          <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">Откройте пост по кнопке ниже</div>
          </div>
          <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">Поставьте <b>любую реакцию</b> (❤️🔥👍 и т.д.)</div>
          </div>
          <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">Вернитесь и нажмите "Проверить"</div>
          </div>
        </div>
        
        <button id="open-post-btn" class="btn btn-secondary">
          🔗 Открыть пост в Telegram
        </button>
      </div>
    </div>

    <button id="complete-btn" class="btn btn-primary" disabled>
      ✨ Проверить выполнение
    </button>

    <div id="status" class="status info hidden"></div>
  </div>

  <div id="error" class="hidden" style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 72px; margin-bottom: 24px;">❌</div>
    <h2 style="margin-bottom: 16px; font-size: 22px;">Ошибка</h2>
    <p id="error-msg" style="margin-bottom: 24px; opacity: 0.8; font-size: 16px;"></p>
    <button onclick="Telegram.WebApp.close()" class="btn btn-secondary" style="max-width: 240px; margin: 0 auto;">
      Закрыть
    </button>
  </div>

  <script>
    console.log('🚀 Mini App запускается...');
    
    const tg = window.Telegram?.WebApp;
    if (!tg) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error-msg').textContent = 'Откройте через Telegram';
      throw new Error('Telegram WebApp not found');
    }
    
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#1a1a2e');
    tg.setBackgroundColor?.('#1a1a2e');
    
    console.log('✅ Telegram WebApp готов');

    const params = new URLSearchParams(window.location.search);
    const task = {
      id: params.get('task_id'),
      type: params.get('type'),
      title: decodeURIComponent(params.get('title') || ''),
      reward: params.get('reward'),
      link: decodeURIComponent(params.get('link') || ''),
      chatId: params.get('chat_id'),
      messageId: params.get('message_id')
    };

    console.log('📋 Задание:', task);

    const $ = id => document.getElementById(id);
    const loading = $('loading');
    const content = $('content');
    const error = $('error');
    const errorMsg = $('error-msg');
    const title = $('task-title');
    const reward = $('task-reward');
    const viewSection = $('view-section');
    const reactSection = $('react-section');
    const completeBtn = $('complete-btn');
    const status = $('status');
    const timerBig = $('timer-big');
    const progressBar = $('progress-bar');

    let state = {
      timeSpent: 0,
      postOpened: false,
      completed: false
    };

    const VIEW_TIME = 15;

    function showError(msg) {
      console.error('❌', msg);
      loading.classList.add('hidden');
      content.classList.add('hidden');
      error.classList.remove('hidden');
      errorMsg.textContent = msg;
    }

    function showStatus(msg, type = 'info') {
      status.classList.remove('hidden', 'info', 'success', 'error');
      status.classList.add(type);
      status.textContent = msg;
    }

    function enableComplete() {
      if (task.type === 'view' && state.timeSpent >= VIEW_TIME && state.postOpened) {
        completeBtn.disabled = false;
        showStatus('✅ Готово! Нажмите "Проверить выполнение"', 'success');
      }
      if (task.type === 'react' && state.postOpened) {
        completeBtn.disabled = false;
        showStatus('✅ Готово! Нажмите "Проверить выполнение"', 'success');
      }
    }

    // VIEW: Просмотр
    function setupView() {
      viewSection.classList.remove('hidden');
      
      $('open-link-btn').addEventListener('click', () => {
        state.postOpened = true;
        showStatus('📱 Пост открыт! Просмотрите 15 секунд', 'info');
        
        if (tg.openTelegramLink && task.link) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
        
        enableComplete();
      });

      let remaining = VIEW_TIME;
      const timer = setInterval(() => {
        state.timeSpent++;
        remaining = Math.max(0, VIEW_TIME - state.timeSpent);
        timerBig.textContent = remaining;
        progressBar.style.width = `${(state.timeSpent / VIEW_TIME) * 100}%`;
        
        if (remaining <= 0) {
          clearInterval(timer);
          timerBig.textContent = '✓';
          timerBig.style.color = '#10b981';
          enableComplete();
        }
      }, 1000);
    }

    // REACT: Реакция
    function setupReact() {
      reactSection.classList.remove('hidden');
      
      $('open-post-btn').addEventListener('click', () => {
        state.postOpened = true;
        showStatus('📱 Пост открыт! Поставьте реакцию и вернитесь', 'info');
        
        if (tg.openTelegramLink && task.link) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
        
        enableComplete();
      });
    }

    // Отправка данных
    completeBtn.addEventListener('click', () => {
      if (state.completed) return;
      state.completed = true;
      
      completeBtn.disabled = true;
      completeBtn.textContent = '⏳ Проверка...';
      showStatus('🔄 Проверяем выполнение...', 'info');

      const payload = {
        task_id: task.id,
        user_id: tg.initDataUnsafe?.user?.id,
        type: task.type,
        time_spent: state.timeSpent,
        post_opened: state.postOpened,
        link: task.link,
        ts: Date.now()
      };

      console.log('📤 Отправка:', payload);

      try {
        tg.sendData(JSON.stringify(payload));
        showStatus('✅ Данные отправлены! Закрываем...', 'success');
        
        setTimeout(() => {
          console.log('🔒 Закрытие Mini App');
          tg.close();
        }, 800);
      } catch (err) {
        console.error('❌ Ошибка:', err);
        showStatus('❌ Ошибка: ' + err.message, 'error');
        state.completed = false;
        completeBtn.disabled = false;
      }
    });

    function init() {
      if (!task.id || !task.type) {
        showError('Неверные данные задания');
        return;
      }

      title.textContent = task.title || 'Задание';
      reward.textContent = `💰 ${task.reward} PMC`;

      if (task.type === 'view') setupView();
      else if (task.type === 'react') setupReact();
      else { showError('Неизвестный тип: ' + task.type); return; }

      loading.classList.add('hidden');
      content.classList.remove('hidden');
      console.log('✅ Mini App готов');
    }

    init();
  </script>
</body>
</html>
