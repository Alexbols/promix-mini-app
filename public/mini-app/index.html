<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promix Task</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }
    .gradient h1 { font-size: 22px; margin-bottom: 8px; }
    .gradient p { opacity: 0.9; font-size: 16px; font-weight: 600; }
    
    .timer-display {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      color: #667eea;
    }
    
    .progress-container {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 1s linear;
    }
    
    .reactions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .reaction-btn {
      background: rgba(255,255,255,0.08);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 16px;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .reaction-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
    .reaction-btn.selected {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: #fff;
      transform: scale(1.1);
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
      border: 1px solid #667eea;
    }
    
    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
    }
    .status.info { background: rgba(102, 126, 234, 0.15); color: #a5b4fc; }
    .status.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .status.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    
    .info-block {
      background: rgba(102, 126, 234, 0.1);
      border-left: 3px solid #667eea;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 14px;
    }
    
    iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 12px;
      background: #fff;
    }
    
    .hidden { display: none !important; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
</head>
<body>
  
  <div id="loading" style="text-align: center; padding: 40px 20px;">
    <div style="width: 60px; height: 60px; border: 4px solid #667eea; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
    <p>Загрузка задания...</p>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <div id="content" class="hidden">
    <div class="gradient">
      <h1 id="task-title">Задание</h1>
      <p id="task-reward">💰 15 PMC</p>
    </div>

    <!-- VIEW: Просмотр поста -->
    <div id="view-section" class="hidden">
      <div class="card">
        <h3 style="margin-bottom: 12px;">👁 Просмотрите пост</h3>
        <div class="info-block">
          ⏱️ Оставайтесь на странице <b id="timer-display">15</b> секунд для засчитывания просмотра
        </div>
        
        <div id="iframe-container" style="margin: 16px 0;">
          <iframe id="embed-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
        
        <button id="open-link-btn" class="btn btn-secondary">
          🔗 Открыть пост в Telegram
        </button>
        
        <div class="timer-display" id="timer-big">15</div>
        
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- REACT: Реакция на пост -->
    <div id="react-section" class="hidden">
      <div class="card">
        <h3 style="margin-bottom: 12px;">❤️ Поставьте реакцию</h3>
        
        <div class="info-block">
          1️⃣ Откройте пост по кнопке ниже<br>
          2️⃣ Поставьте любую реакцию<br>
          3️⃣ Вернитесь и выберите ту же реакцию здесь
        </div>
        
        <button id="open-post-btn" class="btn btn-secondary" style="margin-bottom: 16px;">
          🔗 Открыть пост в Telegram
        </button>
        
        <h4 style="margin: 16px 0 12px;">Выберите вашу реакцию:</h4>
        <div class="reactions-grid" id="reactions-grid">
          <button class="reaction-btn" data-reaction="👍">👍</button>
          <button class="reaction-btn" data-reaction="❤️">❤️</button>
          <button class="reaction-btn" data-reaction="🔥">🔥</button>
          <button class="reaction-btn" data-reaction="🎉">🎉</button>
          <button class="reaction-btn" data-reaction="😮">😮</button>
          <button class="reaction-btn" data-reaction="😢">😢</button>
          <button class="reaction-btn" data-reaction="😡">😡</button>
          <button class="reaction-btn" data-reaction="🤔">🤔</button>
          <button class="reaction-btn" data-reaction="👏">👏</button>
          <button class="reaction-btn" data-reaction="🤩">🤩</button>
          <button class="reaction-btn" data-reaction="😱">😱</button>
          <button class="reaction-btn" data-reaction="💩">💩</button>
        </div>
      </div>
    </div>

    <button id="complete-btn" class="btn btn-primary" disabled>
      ✨ Выполнить задание
    </button>

    <div id="status" class="status info hidden"></div>
  </div>

  <div id="error" class="hidden" style="text-align: center; padding: 40px 20px;">
    <div style="font-size: 64px; margin-bottom: 20px;">❌</div>
    <h2 style="margin-bottom: 12px;">Ошибка</h2>
    <p id="error-msg" style="margin-bottom: 20px; opacity: 0.8;"></p>
    <button onclick="Telegram.WebApp.close()" class="btn btn-secondary" style="max-width: 200px; margin: 0 auto;">
      Закрыть
    </button>
  </div>

  <script>
    // ============ ИНИЦИАЛИЗАЦИЯ ============
    console.log('🚀 Mini App запускается...');
    
    const tg = window.Telegram?.WebApp;
    if (!tg) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error-msg').textContent = 'Откройте через Telegram';
      throw new Error('Telegram WebApp not found');
    }
    
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('#1a1a2e');
    tg.setBackgroundColor?.('#1a1a2e');
    
    console.log('✅ Telegram WebApp готов');
    console.log('👤 User:', tg.initDataUnsafe?.user);

    // ============ ПАРСИНГ ДАННЫХ ============
    const params = new URLSearchParams(window.location.search);
    const task = {
      id: params.get('task_id'),
      type: params.get('type'),
      title: decodeURIComponent(params.get('title') || ''),
      reward: params.get('reward'),
      link: decodeURIComponent(params.get('link') || ''),
      chatId: params.get('chat_id'),
      messageId: params.get('message_id')
    };

    console.log('📋 Задание:', task);

    // ============ ЭЛЕМЕНТЫ ============
    const $ = id => document.getElementById(id);
    const loading = $('loading');
    const content = $('content');
    const error = $('error');
    const errorMsg = $('error-msg');
    const title = $('task-title');
    const reward = $('task-reward');
    const viewSection = $('view-section');
    const reactSection = $('react-section');
    const completeBtn = $('complete-btn');
    const status = $('status');
    const embedFrame = $('embed-frame');
    const timerBig = $('timer-big');
    const timerDisplay = $('timer-display');
    const progressBar = $('progress-bar');

    // ============ СОСТОЯНИЕ ============
    let state = {
      timeSpent: 0,
      reaction: null,
      postOpened: false,
      completed: false
    };

    const VIEW_TIME = 15;
    const VALID_REACTIONS = ['👍','❤️','🔥','🎉','😮','😢','😡','🤔','👏','🤩','😱','💩','👎','🤯'];

    // ============ ФУНКЦИИ ============
    function showError(msg) {
      console.error('❌', msg);
      loading.classList.add('hidden');
      content.classList.add('hidden');
      error.classList.remove('hidden');
      errorMsg.textContent = msg;
    }

    function showStatus(msg, type = 'info') {
      status.classList.remove('hidden', 'info', 'success', 'error');
      status.classList.add(type);
      status.textContent = msg;
    }

    function enableComplete() {
      if (task.type === 'view' && state.timeSpent >= VIEW_TIME) {
        completeBtn.disabled = false;
        showStatus('✅ Готово! Нажмите "Выполнить"', 'success');
      }
      if (task.type === 'react' && state.reaction && state.postOpened) {
        completeBtn.disabled = false;
        showStatus('✅ Готово! Нажмите "Выполнить"', 'success');
      }
    }

    // ============ VIEW: ПРОСМОТ ============
    function setupView() {
      viewSection.classList.remove('hidden');
      
      // Загружаем embed
      if (task.link) {
        if (task.link.includes('t.me/')) {
          const parts = task.link.replace('https://', '').split('/');
          const channel = parts[1];
          const postId = parts[2];
          if (channel && postId) {
            embedFrame.src = `https://t.me/${channel}/${postId}?embed=1&discussion=1`;
          }
        } else {
          embedFrame.src = task.link;
        }
      }

      // Кнопка "Открыть в Telegram"
      $('open-link-btn').addEventListener('click', () => {
        if (tg.openTelegramLink && task.link) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
      });

      // Таймер
      let remaining = VIEW_TIME;
      const timer = setInterval(() => {
        state.timeSpent++;
        remaining = Math.max(0, VIEW_TIME - state.timeSpent);
        timerBig.textContent = remaining;
        timerDisplay.textContent = remaining;
        progressBar.style.width = `${(state.timeSpent / VIEW_TIME) * 100}%`;
        
        if (remaining <= 0) {
          clearInterval(timer);
          timerBig.textContent = '✓';
          timerBig.style.color = '#10b981';
          enableComplete();
        }
      }, 1000);
    }

    // ============ REACT: РЕАКЦИЯ ============
    function setupReact() {
      reactSection.classList.remove('hidden');
      
      // Кнопка "Открыть пост"
      $('open-post-btn').addEventListener('click', () => {
        state.postOpened = true;
        showStatus('📱 Пост открыт! Поставьте реакцию и вернитесь', 'info');
        
        if (tg.openTelegramLink && task.link) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
        
        enableComplete();
      });

      // Кнопки реакций
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.reaction-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          state.reaction = btn.dataset.reaction;
          console.log('🎭 Реакция выбрана:', state.reaction);
          enableComplete();
        });
      });
    }

    // ============ ОТПРАВКА ДАННЫХ ============
    completeBtn.addEventListener('click', () => {
      if (state.completed) return;
      state.completed = true;
      
      completeBtn.disabled = true;
      completeBtn.textContent = '⏳ Отправка...';
      showStatus('🔄 Отправка данных боту...', 'info');

      const payload = {
        task_id: task.id,
        user_id: tg.initDataUnsafe?.user?.id,
        type: task.type,
        time_spent: state.timeSpent,
        reaction: state.reaction,
        post_opened: state.postOpened,
        chat_id: task.chatId,
        message_id: task.messageId,
        link: task.link,
        ts: Date.now()
      };

      console.log('📤 Отправка:', payload);

      try {
        tg.sendData(JSON.stringify(payload));
        showStatus('✅ Данные отправлены! Закрываем...', 'success');
        
        setTimeout(() => {
          console.log('🔒 Закрытие Mini App');
          tg.close();
        }, 800);
      } catch (err) {
        console.error('❌ Ошибка sendData:', err);
        showStatus('❌ Ошибка: ' + err.message, 'error');
        state.completed = false;
        completeBtn.disabled = false;
      }
    });

    // ============ ЗАПУСК ============
    function init() {
      if (!task.id || !task.type) {
        showError('Неверные данные задания. Откройте через бота.');
        return;
      }

      title.textContent = task.title || 'Задание';
      reward.textContent = `💰 ${task.reward} PMC`;

      if (task.type === 'view') {
        setupView();
      } else if (task.type === 'react') {
        setupReact();
      } else {
        showError('Неизвестный тип задания: ' + task.type);
        return;
      }

      loading.classList.add('hidden');
      content.classList.remove('hidden');
      console.log('✅ Mini App готов');
    }

    init();
  </script>
</body>
</html>
