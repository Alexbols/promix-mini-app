<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promix Task</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .gradient { background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .reaction-btn { transition: all 0.2s; }
    .reaction-btn:hover { transform: scale(1.1); }
    .reaction-btn.selected { background: linear-gradient(135deg, #6366f1, #8b5cf6); transform: scale(1.15); box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  
  <div id="loading" class="text-center">
    <div class="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-slate-400">Загрузка задания...</p>
  </div>

  <div id="content" class="hidden w-full max-w-sm">
    <div class="gradient p-4 rounded-xl mb-4 text-center">
      <h1 class="text-xl font-bold" id="task-title">Задание</h1>
      <p class="text-sm opacity-90" id="task-reward">💰 15 PMC</p>
    </div>

    <div id="view-progress" class="hidden mb-4">
      <p class="text-center text-sm text-slate-400 mb-2">Просмотрите контент <b id="timer">15</b> секунд</p>
      <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full gradient w-0 transition-all duration-1000"></div>
      </div>
    </div>

    <div id="view-content" class="hidden bg-slate-800 p-4 rounded-xl mb-4">
      <iframe id="embed-frame" class="w-full h-48 rounded-lg border border-slate-700" frameborder="0"></iframe>
      <p class="text-xs text-slate-500 mt-2">⚠️ Не закрывайте окно до завершения</p>
    </div>

    <div id="react-btn" class="hidden mb-4">
      <p class="text-center text-sm text-slate-400 mb-3">Выберите любую реакцию:</p>
      <div class="grid grid-cols-4 gap-3">
        <button data-reaction="👍" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">👍</button>
        <button data-reaction="❤️" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">❤️</button>
        <button data-reaction="🔥" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">🔥</button>
        <button data-reaction="🎉" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">🎉</button>
        <button data-reaction="😮" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">😮</button>
        <button data-reaction="😢" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">😢</button>
        <button data-reaction="😡" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">😡</button>
        <button data-reaction="🤔" class="reaction-btn bg-slate-700 hover:bg-slate-600 p-4 rounded-xl text-3xl">🤔</button>
      </div>
      <p class="text-xs text-slate-500 mt-3 text-center">Нажмите на любую реакцию</p>
    </div>

    <button id="complete-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed" disabled>
      ✨ Выполнить задание
    </button>

    <p id="status" class="text-center text-sm text-slate-400 mt-3"></p>
  </div>

  <div id="error" class="hidden text-center text-red-400">
    <p>❌ Ошибка загрузки задания</p>
    <button onclick="Telegram.WebApp.close()" class="mt-4 text-indigo-400 underline">Закрыть</button>
  </div>

  <script>
    console.log('🚀 Mini App загружается...');
    
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    console.log('✅ Telegram WebApp инициализирован');
    console.log('📱 initData:', tg.initData ? 'есть' : 'нет');
    console.log('👤 user:', tg.initDataUnsafe.user);

    const urlParams = new URLSearchParams(window.location.search);
    console.log('🔗 URL параметры:', Object.fromEntries(urlParams));
    
    const task = {
      id: urlParams.get('task_id'),
      type: urlParams.get('type'),
      title: urlParams.get('title'),
      reward: urlParams.get('reward'),
      link: urlParams.get('link'),
      chatId: urlParams.get('chat_id'),
      messageId: urlParams.get('message_id')
    };

    console.log('📋 Task данные:', task);

    const els = {
      loading: document.getElementById('loading'),
      content: document.getElementById('content'),
      error: document.getElementById('error'),
      title: document.getElementById('task-title'),
      reward: document.getElementById('task-reward'),
      viewProgress: document.getElementById('view-progress'),
      timer: document.getElementById('timer'),
      progressBar: document.getElementById('progress-bar'),
      viewContent: document.getElementById('view-content'),
      embedFrame: document.getElementById('embed-frame'),
      reactBtn: document.getElementById('react-btn'),
      completeBtn: document.getElementById('complete-btn'),
      status: document.getElementById('status')
    };

    const TASK_TYPES = {
      view: { minTime: 15, label: 'Просмотр' },
      react: { minTime: 0, label: 'Реакция' }
    };

    let timeSpent = 0;
    let reaction = null;
    let timerInterval = null;

    function init() {
      console.log('🔧 Инициализация задания...');
      
      if (!task.id || !task.type) {
        console.error('❌ Нет task_id или type');
        showError('Неверные данные задания');
        return;
      }

      console.log(`✅ Задание: ${task.title}, тип: ${task.type}`);
      els.title.textContent = task.title || 'Задание';
      els.reward.textContent = `💰 ${task.reward} PMC`;

      if (task.type === 'view') {
        console.log('👁 Настройка задания просмотра');
        setupViewTask();
      } else if (task.type === 'react') {
        console.log('❤️ Настройка задания реакции');
        setupReactTask();
      } else {
        console.error('❌ Неизвестный тип:', task.type);
        showError('Неподдерживаемый тип задания');
        return;
      }

      els.loading.classList.add('hidden');
      els.content.classList.remove('hidden');
      console.log('✅ Контент отображён');
    }

    function setupViewTask() {
      els.viewProgress.classList.remove('hidden');
      els.viewContent.classList.remove('hidden');
      
      if (task.link) {
        console.log('🔗 Загрузка контента:', task.link);
        if (task.link.includes('t.me/')) {
          const parts = task.link.split('/');
          const channel = parts[3];
          const postId = parts[4];
          if (channel && postId) {
            els.embedFrame.src = `https://t.me/${channel}/${postId}?embed=1&mode=dark`;
            console.log('✅ Embed URL установлен');
          }
        } else {
          els.embedFrame.src = task.link;
        }
      }

      const minTime = TASK_TYPES.view.minTime;
      let remaining = minTime;
      
      console.log(`⏱️ Таймер запущен: ${minTime} секунд`);
      timerInterval = setInterval(() => {
        timeSpent++;
        remaining = Math.max(0, minTime - timeSpent);
        els.timer.textContent = remaining;
        els.progressBar.style.width = `${(timeSpent / minTime) * 100}%`;
        
        if (remaining <= 0) {
          clearInterval(timerInterval);
          console.log('✅ Время просмотра завершено');
          els.status.textContent = '✅ Время просмотра истекло!';
          enableComplete();
        }
      }, 1000);
    }

    function setupReactTask() {
      els.reactBtn.classList.remove('hidden');
      console.log('✅ Кнопки реакций отображены');
      
      document.querySelectorAll('.reaction-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const selectedReaction = btn.getAttribute('data-reaction');
          console.log(`🎭 Реакция выбрана: ${selectedReaction}`);
          
          document.querySelectorAll('.reaction-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          reaction = selectedReaction;
          els.status.textContent = `Выбрана реакция: ${reaction}`;
          enableComplete();
        });
      });
    }

    function enableComplete() {
      console.log('🔓 Активация кнопки выполнения');
      if (task.type === 'view' && timeSpent >= TASK_TYPES.view.minTime) {
        els.completeBtn.disabled = false;
        console.log('✅ Кнопка активирована (view)');
      }
      if (task.type === 'react' && reaction) {
        els.completeBtn.disabled = false;
        console.log('✅ Кнопка активирована (react)');
      }
    }

    els.completeBtn.addEventListener('click', () => {
      console.log('🚀 Кнопка выполнения нажата!');
      els.completeBtn.disabled = true;
      els.status.textContent = '🔄 Отправка данных...';

      const verification = {
        task_id: task.id,
        user_id: tg.initDataUnsafe.user?.id,
        type: task.type,
        time_spent: timeSpent,
        reaction: reaction,
        chat_id: task.chatId,
        message_id: task.messageId,
        timestamp: Date.now()
      };

      console.log('📤 Отправка данных боту:');
      console.log(JSON.stringify(verification, null, 2));

      try {
        tg.sendData(JSON.stringify(verification));
        console.log('✅ sendData вызван успешно');
        els.status.textContent = '✅ Данные отправлены!';
        
        setTimeout(() => {
          console.log('🔒 Закрытие Mini App');
          tg.close();
        }, 1000);
      } catch (err) {
        console.error('❌ Ошибка sendData:', err);
        els.status.textContent = '❌ Ошибка отправки: ' + err.message;
      }
    });

    function showError(msg) {
      console.error('❌ Ошибка:', msg);
      els.loading.classList.add('hidden');
      els.error.classList.remove('hidden');
      els.error.querySelector('p').textContent = `❌ ${msg}`;
    }

    // Запуск
    if (window.location.search) {
      init();
    } else {
      console.error('❌ Нет параметров в URL');
      showError('Откройте через Telegram-бота');
    }
  </script>
</body>
</html>
