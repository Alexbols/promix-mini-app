<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promix Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .loader-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .nav {
      display: flex; background: rgba(22, 33, 62, 0.95); backdrop-filter: blur(10px);
      padding: 10px; gap: 8px; position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
    }
    .nav-btn {
      flex: 1; padding: 12px 8px; background: rgba(15, 52, 96, 0.6);
      border: none; border-radius: 12px; color: #fff; font-weight: 600;
      cursor: pointer; transition: all 0.3s; font-size: 14px;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .tab-content { padding: 20px; min-height: calc(100vh - 80px); }
    
    .profile-card {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      padding: 25px; border-radius: 20px; margin-bottom: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .profile-card h2 { color: #ffd700; margin-bottom: 15px; font-size: 24px; }
    .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .stat-row:last-child { border: none; }
    .stat-label { color: #888; }
    .stat-value { font-weight: 700; color: #fff; }
    .vip-badge { display: inline-block; background: linear-gradient(135deg, #ffd700, #ffed4e); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    
    .wheel-wrapper { text-align: center; padding: 20px 0; }
    .wheel-container { position: relative; width: 320px; height: 320px; margin: 20px auto; }
    .wheel-pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 40px; z-index: 10; filter: drop-shadow(0 0 10px #ffd700); }
    .wheel {
      width: 100%; height: 100%; border-radius: 50%; position: relative;
      border: 8px solid #ffd700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.5);
      transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      overflow: hidden;
    }
    .wheel-segment {
      position: absolute; width: 50%; height: 50%; top: 0; right: 0;
      transform-origin: 0% 100%; display: flex; align-items: center; justify-content: center;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }
    .wheel-segment-content {
      transform: rotate(22.5deg) translateY(-40px);
      font-size: 28px; font-weight: 700;
    }
    .wheel-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 60px; height: 60px; background: linear-gradient(135deg, #ffd700, #ffed4e);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; z-index: 5; box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
    }
    
    .spin-btn {
      padding: 18px 60px; font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none; border-radius: 50px; color: #fff; cursor: pointer;
      margin-top: 30px; box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
      transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
    }
    .spin-btn:active { transform: scale(0.95); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .spins-info { margin-top: 15px; font-size: 16px; color: #ffd700; font-weight: 600; }
    
    .chat-container { display: flex; flex-direction: column; height: calc(100vh - 140px); }
    .chat-messages {
      flex: 1; overflow-y: auto; background: rgba(22, 33, 62, 0.6);
      padding: 15px; border-radius: 15px; margin-bottom: 15px;
    }
    .chat-msg {
      margin-bottom: 12px; padding: 10px 15px; background: rgba(15, 52, 96, 0.4);
      border-radius: 12px; border-left: 3px solid #667eea;
    }
    .chat-msg-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
    .chat-msg-user { color: #ffd700; font-weight: 600; }
    .chat-msg-time { color: #666; }
    .chat-msg-text { color: #fff; word-wrap: break-word; }
    .chat-input-box { display: flex; gap: 10px; }
    .chat-input-box input {
      flex: 1; padding: 12px 15px; background: rgba(22, 33, 62, 0.8);
      border: 2px solid rgba(102, 126, 234, 0.3); border-radius: 25px; color: #fff; font-size: 16px;
    }
    .chat-input-box input:focus { outline: none; border-color: #667eea; }
    .chat-send-btn {
      padding: 12px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; border-radius: 25px; color: #fff; font-weight: 600; cursor: pointer;
    }
    
    .leader-item {
      background: rgba(22, 33, 62, 0.6); padding: 15px 20px; border-radius: 15px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .leader-rank { font-size: 28px; font-weight: 700; min-width: 50px; text-align: center; }
    .leader-info { flex: 1; }
    .leader-name { font-weight: 700; color: #ffd700; font-size: 16px; }
    .leader-stats { color: #888; font-size: 13px; margin-top: 3px; }
    
    .prize-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(10px);
    }
    .prize-modal.show { display: flex; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .prize-content {
      background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      padding: 40px; border-radius: 25px; text-align: center;
      border: 2px solid #ffd700; box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      max-width: 90%;
    }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .prize-emoji { font-size: 80px; margin-bottom: 20px; }
    .prize-title { font-size: 28px; color: #ffd700; margin-bottom: 15px; font-weight: 700; }
    .prize-desc { font-size: 20px; margin-bottom: 25px; }
    .prize-close {
      padding: 14px 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; border-radius: 25px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    
    h2 { color: #ffd700; margin-bottom: 20px; }
    .empty { text-align: center; color: #666; padding: 40px; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-tab="profile">👤 Профиль</button>
    <button class="nav-btn" data-tab="wheel">🎰 Колесо</button>
    <button class="nav-btn" data-tab="chat">💬 Чат</button>
    <button class="nav-btn" data-tab="leaderboard">🏆 Топ</button>
  </div>

  <div id="profile" class="tab-content"></div>
  <div id="wheel" class="tab-content" style="display:none"></div>
  <div id="chat" class="tab-content" style="display:none"></div>
  <div id="leaderboard" class="tab-content" style="display:none"></div>

  <div class="prize-modal" id="prizeModal">
    <div class="prize-content">
      <div class="prize-emoji" id="prizeEmoji">🎁</div>
      <div class="prize-title" id="prizeTitle">Поздравляем!</div>
      <div class="prize-desc" id="prizeDesc"></div>
      <button class="prize-close" onclick="closePrize()">Забрать</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#1a1a2e');
      tg.setBackgroundColor('#1a1a2e');
    }

    // API URL - берём из текущего хоста
    const API_BASE = window.location.origin;
    
    const getHeaders = () => {
      const headers = { 'Content-Type': 'application/json' };
      if (tg?.initData) headers['X-Telegram-Init-Data'] = tg.initData;
      return headers;
    };

    const api = {
      getProfile: () => fetch(`${API_BASE}/api/profile`, { headers: getHeaders() }).then(r => r.json()),
      spin: () => fetch(`${API_BASE}/api/spin`, { method: 'POST', headers: getHeaders() }).then(r => r.json()),
      getLeaderboard: () => fetch(`${API_BASE}/api/leaderboard`).then(r => r.json()),
      getChat: () => fetch(`${API_BASE}/api/chat`).then(r => r.json()),
      sendChat: (message) => fetch(`${API_BASE}/api/chat`, {
        method: 'POST', headers: getHeaders(), body: JSON.stringify({ message })
      }).then(r => r.json())
    };

    let profile = null;
    let spinning = false;
    let currentRotation = 0;

    // Призы для колеса (должны совпадать с сервером)
    const WHEEL_PRIZES = [
      { type: 'coins', amount: 10, label: '10 PMC', emoji: '💰', color: '#ff6b6b' },
      { type: 'coins', amount: 50, label: '50 PMC', emoji: '💎', color: '#4ecdc4' },
      { type: 'xp', amount: 50, label: '+50 XP', emoji: '⚡', color: '#ffe66d' },
      { type: 'coins', amount: 100, label: '100 PMC', emoji: '🏆', color: '#a8e6cf' },
      { type: 'vip_days', amount: 1, label: 'VIP 1 день', emoji: '🎫', color: '#ff8b94' },
      { type: 'xp', amount: 100, label: '+100 XP', emoji: '⚡⚡', color: '#ffd3a5' },
      { type: 'coins', amount: 500, label: '500 PMC', emoji: '👑', color: '#fdffab' },
      { type: 'nothing', amount: 0, label: 'Попробуй ещё', emoji: '🔄', color: '#a8edea' }
    ];

    // Инициализация
    async function init() {
      try {
        profile = await api.getProfile();
        document.getElementById('loader').style.display = 'none';
        renderProfile();
      } catch (e) {
        document.getElementById('loader').innerHTML = 
          '<div style="color:#ff6b6b;text-align:center;padding:20px;">Ошибка загрузки. Перезапустите приложение.</div>';
        console.error('Init error:', e);
      }
    }

    // Навигация
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.getElementById(tab).style.display = 'block';
        
        if (tab === 'profile') renderProfile();
        if (tab === 'wheel') renderWheel();
        if (tab === 'chat') loadChat();
        if (tab === 'leaderboard') loadLeaderboard();
      });
    });

    function renderProfile() {
      if (!profile) return;
      document.getElementById('profile').innerHTML = `
        <div class="profile-card">
          <h2>👤 ${profile.username} ${profile.is_vip ? '<span class="vip-badge">👑 VIP</span>' : ''}</h2>
          <div class="stat-row"><span class="stat-label">💰 Баланс</span><span class="stat-value">${profile.balance.toLocaleString()} PMC</span></div>
          <div class="stat-row"><span class="stat-label">⚡ Опыт</span><span class="stat-value">${profile.xp} XP</span></div>
          <div class="stat-row"><span class="stat-label">🏆 Уровень</span><span class="stat-value">${profile.level}</span></div>
          <div class="stat-row"><span class="stat-label">🎰 Спинов осталось</span><span class="stat-value">${profile.spins_left} / ${profile.max_spins}</span></div>
          <div class="stat-row"><span class="stat-label">🏆 Всего побед</span><span class="stat-value">${profile.total_wins}</span></div>
          <div class="stat-row"><span class="stat-label">💎 Выиграно всего</span><span class="stat-value">${profile.total_won.toLocaleString()} PMC</span></div>
          ${profile.is_vip && profile.vip_expires ? `<div class="stat-row"><span class="stat-label">📅 VIP до</span><span class="stat-value">${new Date(profile.vip_expires).toLocaleDateString('ru-RU')}</span></div>` : ''}
        </div>
      `;
    }

    function renderWheel() {
      if (!profile) return;
      const segmentAngle = 360 / WHEEL_PRIZES.length;
      
      const segments = WHEEL_PRIZES.map((p, i) => {
        const rotation = i * segmentAngle;
        return `<div class="wheel-segment" style="transform: rotate(${rotation}deg); background: ${p.color};">
          <div class="wheel-segment-content">${p.emoji}</div>
        </div>`;
      }).join('');

      document.getElementById('wheel').innerHTML = `
        <div class="wheel-wrapper">
          <h2>🎰 Колесо Фортуны</h2>
          <div class="wheel-container">
            <div class="wheel-pointer">▼</div>
            <div class="wheel" id="wheelDisc">${segments}
              <div class="wheel-center">🎯</div>
            </div>
          </div>
          <div class="spins-info">Осталось спинов: <b>${profile.spins_left}</b> / ${profile.max_spins}</div>
          <button class="spin-btn" id="spinBtn" ${profile.spins_left <= 0 || spinning ? 'disabled' : ''}>
            ${profile.spins_left <= 0 ? 'СПИНЫ КОНЧИЛИСЬ' : '🎰 КРУТИТЬ!'}
          </button>
        </div>
      `;

      const wheelDisc = document.getElementById('wheelDisc');
      wheelDisc.style.transform = `rotate(${currentRotation}deg)`;

      document.getElementById('spinBtn').addEventListener('click', spin);
    }

    async function spin() {
      if (spinning || profile.spins_left <= 0) return;
      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('spinBtn').textContent = 'КРУТИМ...';

      try {
        const result = await api.spin();
        
        if (!result.success) {
          alert('❌ ' + (result.reason === 'no_spins_left' ? 'Спины закончились!' : 'Ошибка'));
          spinning = false;
          renderWheel();
          return;
        }

        // Находим индекс приза
        const prizeIndex = WHEEL_PRIZES.findIndex(p => 
          p.type === result.prize.type && p.amount === result.prize.amount
        );
        const finalIndex = prizeIndex >= 0 ? prizeIndex : 0;
        
        // Рассчитываем угол вращения
        const segmentAngle = 360 / WHEEL_PRIZES.length;
        const targetAngle = 360 - (finalIndex * segmentAngle) - (segmentAngle / 2);
        const spins = 5; // 5 полных оборотов
        currentRotation += spins * 360 + targetAngle;

        const wheelDisc = document.getElementById('wheelDisc');
        wheelDisc.style.transform = `rotate(${currentRotation}deg)`;

        // Ждём окончания анимации
        setTimeout(() => {
          showPrize(result.prize);
          profile.spins_left = result.spins_left;
          spinning = false;
          renderWheel();
          // Обновляем профиль
          api.getProfile().then(p => { profile = p; });
        }, 5100);

      } catch (e) {
        console.error('Spin error:', e);
        alert('Ошибка соединения');
        spinning = false;
        renderWheel();
      }
    }

    function showPrize(prize) {
      document.getElementById('prizeEmoji').textContent = prize.emoji;
      document.getElementById('prizeTitle').textContent = prize.type === 'nothing' ? 'Не повезло!' : '🎉 Поздравляем!';
      document.getElementById('prizeDesc').textContent = prize.label;
      document.getElementById('prizeModal').classList.add('show');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function closePrize() {
      document.getElementById('prizeModal').classList.remove('show');
    }

    async function loadChat() {
      try {
        const messages = await api.getChat();
        renderChat(messages);
      } catch (e) {
        document.getElementById('chat').innerHTML = '<div class="empty">Ошибка загрузки чата</div>';
      }
    }

    function renderChat(messages) {
      const messagesHtml = messages.length ? messages.map(m => `
        <div class="chat-msg">
          <div class="chat-msg-header">
            <span class="chat-msg-user">@${m.username || 'Anonymous'}</span>
            <span class="chat-msg-time">${new Date(m.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          <div class="chat-msg-text">${escapeHtml(m.message)}</div>
        </div>
      `).join('') : '<div class="empty">Пока нет сообщений. Будь первым!</div>';

      document.getElementById('chat').innerHTML = `
        <h2>💬 Общий чат</h2>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">${messagesHtml}</div>
          <div class="chat-input-box">
            <input type="text" id="chatInput" placeholder="Напишите сообщение..." maxlength="500">
            <button class="chat-send-btn" onclick="sendMsg()">📤</button>
          </div>
        </div>
      `;

      const input = document.getElementById('chatInput');
      input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });
      
      const msgs = document.getElementById('chatMessages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      try {
        const messages = await api.sendChat(msg);
        renderChat(messages);
      } catch (e) {
        alert('Ошибка отправки');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadLeaderboard() {
      try {
        const board = await api.getLeaderboard();
        const medals = ['🥇', '🥈', '🥉'];
        const html = board.length ? board.map((u, i) => `
          <div class="leader-item">
            <div class="leader-rank">${medals[i] || (i + 1)}</div>
            <div class="leader-info">
              <div class="leader-name">@${u.username || u.tg_id}</div>
              <div class="leader-stats">Выиграно: ${Number(u.total_won).toLocaleString()} PMC • Спинов: ${u.total_spins}</div>
            </div>
          </div>
        `).join('') : '<div class="empty">Пока нет игроков в топе</div>';
        
        document.getElementById('leaderboard').innerHTML = `<h2>🏆 Топ игроков</h2>${html}`;
      } catch (e) {
        document.getElementById('leaderboard').innerHTML = '<div class="empty">Ошибка загрузки</div>';
      }
    }

    init();
  </script>
</body>
</html>
