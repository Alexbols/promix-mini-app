<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Promix Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* (весь стиль из предыдущего кода — оставьте без изменений) */
        /* Я сокращу для краткости, но вы вставьте полный стиль из предыдущего ответа */
    </style>
</head>
<body>
    <!-- Разметка такая же, как была -->
    <div id="loader">...</div>
    <!-- ... -->

    <script>
        // ─── ПОЛНОСТЬЮ АВТОНОМНЫЙ КЛИЕНТ ───
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Получаем ID пользователя (из Telegram)
        let userId = 'guest';
        let username = 'Игрок';
        if (tg?.initDataUnsafe?.user) {
            userId = String(tg.initDataUnsafe.user.id);
            username = tg.initDataUnsafe.user.first_name || 'Игрок';
        }

        // ─── РАБОТА С LOCALSTORAGE ───
        function getData() {
            const key = 'promix_' + userId;
            const raw = localStorage.getItem(key);
            if (raw) {
                try { return JSON.parse(raw); } catch {}
            }
            // Дефолтные данные
            return {
                balance: 1000,
                spins_left: 10,
                max_spins: 10,
                xp: 0,
                level: 1,
                total_wins: 0,
                total_losses: 0,
                total_bets: 0,
                total_won: 0,
                total_lost: 0,
                is_vip: false,
                vip_expires: null,
                chat: [],
                bank: 110000
            };
        }

        function saveData(data) {
            localStorage.setItem('promix_' + userId, JSON.stringify(data));
        }

        // ─── ПРИЗЫ ───
        const WHEEL_PRIZES = [
            { type: 'coins', amount: 10, label: '10 RMC', emoji: '🪙', color: '#f87171' },
            { type: 'coins', amount: 50, label: '50 RMC', emoji: '💎', color: '#4ade80' },
            { type: 'xp', amount: 50, label: '+50 XP', emoji: '⚡', color: '#facc15' },
            { type: 'coins', amount: 100, label: '100 RMC', emoji: '🏆', color: '#60a5fa' },
            { type: 'vip_days', amount: 1, label: 'VIP 1 день', emoji: '👑', color: '#c084fc' },
            { type: 'xp', amount: 100, label: '+100 XP', emoji: '⚡⚡', color: '#fb923c' },
            { type: 'coins', amount: 500, label: '500 RMC', emoji: '💵', color: '#f472b6' },
            { type: 'nothing', amount: 0, label: 'Попробуй ещё', emoji: '🔄', color: '#94a3b8' }
        ];

        // ─── ИНИЦИАЛИЗАЦИЯ ───
        let profile = getData();
        let spinning = false;
        let currentRotation = 0;

        // Функции для обновления UI
        function renderProfile() {
            document.getElementById('profileName').textContent = '👤 ' + username;
            document.getElementById('profileVip').style.display = profile.is_vip ? 'inline-block' : 'none';
            document.getElementById('pBalance').textContent = profile.balance.toLocaleString();
            document.getElementById('pSpins').textContent = profile.spins_left + ' / ' + profile.max_spins;
            document.getElementById('pWins').textContent = profile.total_wins;
            document.getElementById('pLosses').textContent = profile.total_losses;
            document.getElementById('pXp').textContent = profile.xp + ' XP';
            document.getElementById('pBets').textContent = profile.total_bets;
            document.getElementById('pWonSum').textContent = '+' + profile.total_won.toLocaleString();
            document.getElementById('pLostSum').textContent = '−' + profile.total_lost.toLocaleString();

            document.getElementById('balanceDisplay').textContent = profile.balance.toLocaleString();
            document.getElementById('userIdDisplay').textContent = userId;
            document.getElementById('levelDisplay').textContent = 'Lv.' + profile.level;
            document.getElementById('bankDisplay').innerHTML = profile.bank.toLocaleString() + ' <small>RMC</small>';

            document.getElementById('wheelSpinsLeft').textContent = profile.spins_left;
            document.getElementById('wheelMaxSpins').textContent = profile.max_spins;

            const btn = document.getElementById('spinBtn');
            if (profile.spins_left <= 0) {
                btn.disabled = true;
                btn.textContent = '⛔ СПИНЫ КОНЧИЛИСЬ';
            } else {
                btn.disabled = spinning;
                btn.textContent = spinning ? '🌀 КРУТИМ...' : '🎰 КРУТИТЬ!';
            }
        }

        function renderWheel() {
            const container = document.getElementById('wheelDisc');
            const segAngle = 360 / WHEEL_PRIZES.length;
            let html = '';
            WHEEL_PRIZES.forEach((p, i) => {
                const rot = i * segAngle;
                html += `<div class="segment" style="transform:rotate(${rot}deg);background:${p.color};">
                            <div class="inner">${p.emoji}</div>
                        </div>`;
            });
            container.innerHTML = html;
            container.style.transform = `rotate(${currentRotation}deg)`;
        }

        // ─── ВРАЩЕНИЕ ───
        async function spin() {
            if (spinning) return;
            if (profile.spins_left <= 0) {
                showToast('❌ Спины закончились!');
                return;
            }

            spinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.textContent = '🌀 КРУТИМ...';

            // Выбираем случайный приз (честно)
            const randomIndex = Math.floor(Math.random() * WHEEL_PRIZES.length);
            const prize = WHEEL_PRIZES[randomIndex];

            // Симулируем задержку "честного" вращения
            await new Promise(resolve => setTimeout(resolve, 500));

            // Применяем приз
            if (prize.type === 'coins') {
                profile.balance += prize.amount;
                profile.total_won += prize.amount;
                profile.total_wins++;
            } else if (prize.type === 'xp') {
                profile.xp += prize.amount;
                // Повышение уровня (просто для демо)
                if (profile.xp >= profile.level * 100) {
                    profile.level++;
                    profile.xp = 0;
                }
            } else if (prize.type === 'vip_days') {
                profile.is_vip = true;
                const expires = new Date();
                expires.setDate(expires.getDate() + prize.amount);
                profile.vip_expires = expires.toISOString();
            } else {
                // nothing
                profile.total_losses++;
            }
            profile.spins_left--;
            profile.total_bets++;

            // Сохраняем
            saveData(profile);

            // Анимация колеса
            const segAngle = 360 / WHEEL_PRIZES.length;
            const targetAngle = 360 - (randomIndex * segAngle) - (segAngle / 2);
            const extraSpins = 5;
            currentRotation += extraSpins * 360 + targetAngle;

            const disc = document.getElementById('wheelDisc');
            disc.style.transition = 'transform 5s cubic-bezier(0.13, 0.65, 0.08, 0.98)';
            disc.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                showPrize(prize);
                spinning = false;
                renderProfile();
                renderWheel();
                // Кнопка разблокируется после обновления
                const btn2 = document.getElementById('spinBtn');
                btn2.disabled = profile.spins_left <= 0;
                btn2.textContent = profile.spins_left <= 0 ? '⛔ СПИНЫ КОНЧИЛИСЬ' : '🎰 КРУТИТЬ!';
            }, 5200);
        }

        // ─── МОДАЛКА ПРИЗА ───
        function showPrize(prize) {
            document.getElementById('prizeEmoji').textContent = prize.emoji;
            document.getElementById('prizeTitle').textContent = prize.type === 'nothing' ? '😅 Не повезло!' : '🎉 Поздравляем!';
            document.getElementById('prizeDesc').textContent = prize.label;
            document.getElementById('prizeModal').classList.add('show');
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        document.getElementById('prizeBtn').addEventListener('click', () => {
            document.getElementById('prizeModal').classList.remove('show');
        });
        document.getElementById('prizeModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) document.getElementById('prizeModal').classList.remove('show');
        });

        // ─── ЧАТ (локальный) ───
        function renderChat() {
            const container = document.getElementById('chatMessages');
            const msgs = profile.chat || [];
            if (!msgs.length) {
                container.innerHTML = '<div class="empty">💬 Пока нет сообщений. Будь первым!</div>';
                return;
            }
            let html = '';
            msgs.slice(-50).forEach(m => {
                const time = new Date(m.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="msg">
                        <div class="head">
                            <span class="user">@${m.username || 'Anonymous'}</span>
                            <span class="time">${time}</span>
                        </div>
                        <div class="text">${escapeHtml(m.text)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMsg() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            if (!profile.chat) profile.chat = [];
            profile.chat.push({
                username: username,
                text: text,
                time: Date.now()
            });
            saveData(profile);
            renderChat();
        }

        // ─── ЛИДЕРБОРД (локальный) ───
        function renderLeaderboard() {
            const container = document.getElementById('leaderList');
            // В автономном режиме показываем только текущего игрока
            container.innerHTML = `
                <div class="leader-item gold">
                    <div class="rank">🥇</div>
                    <div class="info">
                        <div class="name">@${username} ${profile.is_vip ? '<span class="vip-badge">VIP</span>' : ''}</div>
                        <div class="sub">💰 <span>${profile.total_won.toLocaleString()}</span> RMC · 🎰 ${profile.total_bets} спинов</div>
                    </div>
                </div>
                <div style="text-align:center;color:rgba(255,255,255,0.2);padding:20px 0;font-size:13px;">
                    Топ обновляется при подключении к серверу
                </div>
            `;
        }

        // ─── TOAST ───
        function showToast(msg, dur = 2800) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._hide);
            el._hide = setTimeout(() => el.classList.remove('show'), dur);
        }

        // ─── УТИЛИТЫ ───
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // ─── НАВИГАЦИЯ ───
        function initTabs() {
            const btns = document.querySelectorAll('.tab-btn');
            const contents = {
                profile: document.getElementById('tab-profile'),
                wheel: document.getElementById('tab-wheel'),
                chat: document.getElementById('tab-chat'),
                leaderboard: document.getElementById('tab-leaderboard')
            };
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    btns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.entries(contents).forEach(([key, el]) => {
                        el.classList.toggle('active', key === tab);
                    });
                    if (tab === 'chat') renderChat();
                    if (tab === 'leaderboard') renderLeaderboard();
                    if (tab === 'wheel') renderWheel();
                    if (tab === 'profile') renderProfile();
                });
            });
        }

        // ─── БЕТ-КНОПКИ ───
        function initBets() {
            document.querySelectorAll('#betGrid .bet-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const amount = parseInt(btn.dataset.amount);
                    if (profile.spins_left <= 0) {
                        showToast('❌ Нет спинов для ставки');
                        return;
                    }
                    if (profile.balance < amount) {
                        showToast('❌ Недостаточно RMC');
                        return;
                    }
                    showToast(`💵 Ставка ${amount.toLocaleString()} RMC`);
                    await spin();
                });
            });
        }

        // ─── ТАЙМЕР (имитация) ───
        function startTimer() {
            let count = 2;
            const dot = document.getElementById('timerDot');
            const countEl = document.getElementById('timerCount');
            const textEl = document.getElementById('timerText');
            function tick() {
                count++;
                if (count > 99) count = 2;
                countEl.textContent = count;
                if (count % 3 === 0) {
                    dot.className = 'dot';
                    textEl.innerHTML = 'Идёт раунд <strong>' + count + '</strong>';
                } else if (count % 3 === 1) {
                    dot.className = 'dot waiting';
                    textEl.innerHTML = 'Ожидание (<strong>' + count + '</strong>+)';
                } else {
                    dot.className = 'dot';
                    textEl.innerHTML = 'Подготовка (<strong>' + count + '</strong>)';
                }
            }
            tick();
            setInterval(tick, 3000);
        }

        // ─── ЗАПУСК ───
        function init() {
            // Скрываем лоадер
            document.getElementById('loader').classList.add('hide');

            renderProfile();
            renderWheel();
            initTabs();
            initBets();
            startTimer();

            // Обработка чата
            document.getElementById('chatSend').addEventListener('click', sendChatMsg);
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMsg();
            });

            // Кнопка вращения
            document.getElementById('spinBtn').addEventListener('click', spin);

            // При первом открытии чата и топа
            setTimeout(() => {
                renderChat();
                renderLeaderboard();
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
